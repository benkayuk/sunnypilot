<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fisker Remote</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <header class="status-bar">
      <div class="status-pill" id="connectionPill">
        <span class="dot"></span>
        <span class="label" id="connectionLabel">Connecting&hellip;</span>
      </div>
      <div class="status-pill" id="armPill">
        <span class="dot"></span>
        <span class="label" id="armLabel">Disarmed</span>
      </div>
    </header>

    <section class="angle-readout">
      <div class="angle-value" id="angleValue">0&deg;</div>
      <div class="angle-sub">commanded</div>
    </section>

    <section class="steer-wrap">
      <div class="steer-track" id="steerTrack" aria-label="Steering">
        <div class="steer-track-zero"></div>
        <div class="steer-track-min">-90&deg;</div>
        <div class="steer-track-max">+90&deg;</div>
        <div class="steer-thumb" id="steerThumb"></div>
      </div>
      <div class="steer-hint">Drag left to steer left, right to steer right. Release to center.</div>
    </section>

    <footer class="controls">
      <button type="button" class="btn btn-arm" id="armBtn">
        <span class="btn-icon">&#9654;</span>
        <span>Start App Control</span>
      </button>
      <button type="button" class="btn btn-disarm hidden" id="disarmBtn">
        <span class="btn-icon">&#9632;</span>
        <span>Hand Back to Sunnypilot</span>
      </button>
    </footer>

    <div id="toast" class="toast"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
